name: integration
run-name: integration ${{ inputs.suite || 'all' }} (${{ inputs.test_nodes && 'focused' || 'full' }})

on:
  pull_request:
    types: [labeled]
  schedule:
    - cron: "5 8-20/3 * * 1-6"
      timezone: America/Los_Angeles
  workflow_dispatch:
    inputs:
      suite:
        description: Integration group to run
        type: choice
        options:
          - all
          - providers
          - extensions
          - accounting
          - management
          - management-replica
          - database
          - database-replica
          - mcp
          - security
          - cost
          - sdk
          - browser
        default: all
      workers:
        description: Workers per shard (1-4), blank uses 2 and browser always uses 1
        type: string
        default: ""
      test_nodes:
        description: Optional space-separated pytest paths in one group, blank runs the full selection
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.label.name }}-${{ inputs.suite }}-${{ inputs.workers }}-${{ inputs.test_nodes && 'focused' || 'full' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: integration shard plan
    if: github.event_name != 'pull_request' || github.event.label.name == 'run-ci'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      qualification: ${{ steps.plan.outputs.qualification }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: ./.github/actions/setup-uv-with-retries
        with:
          version: "0.10.9"

      - name: Test the planner and shard qualification
        timeout-minutes: 3
        run: |
          uv run --no-project --with pytest==9.0.3 --with pydantic==2.13.4 \
            python -m pytest --noconftest -o addopts= tests/unit/integration_support/test_github_shards.py

      - name: Plan isolated shards
        id: plan
        env:
          REQUESTED_SUITE: ${{ inputs.suite || 'all' }}
          REQUESTED_WORKERS: ${{ inputs.workers }}
          INTEGRATION_TEST_NODES: ${{ inputs.test_nodes }}
        run: python -m tests.integration._support.github_shards matrix >> "$GITHUB_OUTPUT"

  integration:
    name: ${{ matrix.suite == 'browser' && 'integration browser' || format('integration {0} shard {1}', matrix.suite, matrix.index) }}
    needs: plan
    environment: integration-license
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      UV_PYTHON: "3.12"
      INTEGRATION_WORKERS: ${{ matrix.workers }}
      INTEGRATION_CASE_SHARDS: ${{ matrix.count }}
      INTEGRATION_CASE_SHARD_INDEX: ${{ matrix.index }}
    services:
      postgres:
        image: postgres:16@sha256:e17e86066e5ef83e0952a9347f5c792b7ece00972e2aa787a6986f471b3dd3d5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: circle_test
        ports:
          - 5432:5432
        options: >-
          --shm-size 1g
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine@sha256:7aec734b2bb298a1d769fd8729f13b8514a41bf90fcdd1f38ec52267fbaa8ee6
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - name: Configure the isolated PostgreSQL service
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          wait_postgres() {
            for attempt in $(seq 1 30); do
              if docker exec "$POSTGRES_CONTAINER" pg_isready -U postgres; then return 0; fi
              sleep 1
            done
            return 1
          }
          docker exec "$POSTGRES_CONTAINER" psql -U postgres -d circle_test -c "ALTER SYSTEM SET max_connections = '1000'"
          docker exec "$POSTGRES_CONTAINER" psql -U postgres -d circle_test -c "ALTER SYSTEM SET shared_preload_libraries = 'pg_stat_statements'"
          docker restart "$POSTGRES_CONTAINER"
          wait_postgres
          docker exec "$POSTGRES_CONTAINER" psql -U postgres -d circle_test -c "ALTER SYSTEM SET pg_stat_statements.track = 'all'"
          docker exec "$POSTGRES_CONTAINER" psql -U postgres -d circle_test -c "ALTER SYSTEM SET pg_stat_statements.max = '20000'"
          docker restart "$POSTGRES_CONTAINER"
          wait_postgres

      - name: Set up Python
        timeout-minutes: 3
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.UV_PYTHON }}

      - name: Set up uv
        timeout-minutes: 3
        uses: ./.github/actions/setup-uv-with-retries
        with:
          version: "0.10.9"

      - name: Cache the Rust build
        timeout-minutes: 5
        uses: ./.github/actions/cache-cargo-build

      - name: Cache Prisma binaries
        timeout-minutes: 5
        uses: ./.github/actions/cache-prisma-binaries

      - name: Install dependencies
        timeout-minutes: 60
        run: .github/scripts/uv_sync_with_retries.sh --frozen --all-groups --all-extras

      - name: Install redis-server 7.2.16
        timeout-minutes: 3
        run: |
          mkdir -p "$RUNNER_TEMP/redis-bin"
          cid="$(docker create redis:7.2.16@sha256:0637954999d01b7c9ce9167db2da50656e2590d3b884f1c600c5f63bb6e6773c)"
          docker cp "${cid}:/usr/local/bin/redis-server" "$RUNNER_TEMP/redis-bin/redis-server"
          docker rm "$cid"
          "$RUNNER_TEMP/redis-bin/redis-server" --version | grep -q 'v=7.2.16'
          echo "$RUNNER_TEMP/redis-bin" >> "$GITHUB_PATH"

      - name: Install MCP SDK1 peer
        if: matrix.suite == 'mcp'
        timeout-minutes: 5
        run: |
          uv venv --python 3.12 .venv-mcp-peer
          uv pip install --no-config --exclude-newer "3 days" --python .venv-mcp-peer 'mcp==1.28.1' 'langchain-mcp-adapters==0.2.1'
          echo "MCP_TEST_PEER_PYTHON=$PWD/.venv-mcp-peer/bin/python" >> "$GITHUB_ENV"

      - name: Set up Node.js
        if: matrix.suite == 'browser'
        timeout-minutes: 5
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: ui/litellm-dashboard/.nvmrc
          cache: "npm"
          cache-dependency-path: |
            ui/litellm-dashboard/package-lock.json
            tests/e2e/ui/package-lock.json

      - name: Install browser dependencies and build the dashboard
        if: matrix.suite == 'browser'
        timeout-minutes: 20
        run: |
          (cd ui/litellm-dashboard && npm ci)
          (cd tests/e2e/ui && npm ci)
          sudo env PATH="$PATH" DEBIAN_FRONTEND=noninteractive \
            node tests/e2e/ui/node_modules/@playwright/test/cli.js install-deps chromium
          node tests/e2e/ui/node_modules/@playwright/test/cli.js install chromium
          (cd ui/litellm-dashboard && NEXT_TELEMETRY_DISABLED=1 npm run build)

      - name: Run integration contracts
        timeout-minutes: 170
        env:
          SUITE: ${{ matrix.suite }}
          INTEGRATION_TEST_NODES: ${{ inputs.test_nodes }}
          INTEGRATION_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          INTEGRATION_REDIS_CONTAINER: ${{ job.services.redis.id }}
          LITELLM_LICENSE: ${{ secrets.LITELLM_LICENSE }}
        run: |
          case "$SUITE" in
            *-replica) bash .circleci/scripts/run_integration.sh "${SUITE%-replica}" replica ;;
            *) bash .circleci/scripts/run_integration.sh "$SUITE" ;;
          esac

      - name: Preserve the shard execution record
        if: ${{ !cancelled() && matrix.suite != 'browser' }}
        timeout-minutes: 2
        run: |
          record="$(find test-results -mindepth 2 -maxdepth 2 -name execution.json -print -quit)"
          test -n "$record"
          mkdir -p "$RUNNER_TEMP/shard-execution"
          cp "$record" "$RUNNER_TEMP/shard-execution/execution.json"
          cp "${record%/*}/exit-status.txt" "$RUNNER_TEMP/shard-execution/exit-status.txt"

      - name: Report MCP coverage
        if: ${{ !cancelled() && matrix.suite == 'mcp' }}
        timeout-minutes: 5
        run: |
          coverage_dir=test-results/integration-mcp/coverage
          test -f "$coverage_dir/coverage.txt" && exit 0
          export COVERAGE_FILE="$PWD/$coverage_dir/data"
          .venv/bin/python -m coverage combine --rcfile=tests/integration/mcp_coverage.toml
          .venv/bin/python -m coverage report --rcfile=tests/integration/mcp_coverage.toml > "$coverage_dir/coverage.txt"
          .venv/bin/python -m coverage html --rcfile=tests/integration/mcp_coverage.toml -d "$coverage_dir/html"
          tail -n 1 "$coverage_dir/coverage.txt"

      - name: Check results for the license
        id: secret-scan
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        env:
          SCANNED_SECRET: ${{ secrets.LITELLM_LICENSE }}
        run: python .github/scripts/assert_secret_absent.py test-results

      - name: Upload results
        if: ${{ !cancelled() && steps.secret-scan.outcome == 'success' }}
        timeout-minutes: 10
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: integration-${{ matrix.suite }}-${{ matrix.index }}-of-${{ matrix.count }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          retention-days: 14

      - name: Upload the shard execution record
        if: ${{ !cancelled() && matrix.suite != 'browser' && steps.secret-scan.outcome == 'success' }}
        timeout-minutes: 3
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: integration-execution-${{ matrix.suite }}-${{ matrix.index }}-of-${{ matrix.count }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/shard-execution/
          if-no-files-found: error
          retention-days: 14

  qualification:
    name: integration ${{ matrix.suite }}
    needs: [plan, integration]
    if: ${{ !cancelled() && needs.plan.result == 'success' && inputs.suite != 'browser' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.qualification) }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: ./.github/actions/setup-uv-with-retries
        with:
          version: "0.10.9"

      - name: Download execution records from this attempt
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          pattern: integration-execution-${{ matrix.suite }}-*-of-${{ matrix.count }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: shards

      - name: Verify every candidate ran exactly once and passed or skipped
        env:
          SHARD_COUNT: ${{ matrix.count }}
        run: |
          uv run --no-project --with pydantic==2.13.4 \
            python -m tests.integration._support.sharding shards --shards "$SHARD_COUNT"
          for record in shards/*/execution.json; do
            test "$(cat "${record%/*}/exit-status.txt")" = 0
          done
