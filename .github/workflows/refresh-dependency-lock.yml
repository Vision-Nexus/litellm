name: Refresh dependency lock

on:
  workflow_dispatch:
  pull_request:
    paths:
      - pyproject.toml
      - .github/workflows/refresh-dependency-lock.yml

permissions:
  contents: read

jobs:
  lockfile:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: ./.github/actions/setup-uv-with-retries
        with:
          version: '0.10.9'
      - name: Resolve the lockfile in CI
        run: |
          uv lock
          git rev-parse HEAD > "$RUNNER_TEMP/source-sha.txt"
          git diff -- uv.lock > "$RUNNER_TEMP/uv-lock.patch"
          cp uv.lock "$RUNNER_TEMP/uv.lock"
      - uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: uv-lock-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/source-sha.txt
            ${{ runner.temp }}/uv-lock.patch
            ${{ runner.temp }}/uv.lock
          retention-days: 3
